[project]
name = "orionstack"
version = "0.3.34"
description = "Minimal FAQ and document QA demo for OrionStack"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "elasticsearch>=8.17.0,<9.0.0",
    "fastapi>=0.135.3",
    "httpx>=0.28.1",
    "PyJWT[crypto]>=2.15.1,<3",
    "alembic>=1.18,<2",
    "boto3>=1.40,<2",
    "cedarpy>=4.8.7,<5",
    "ollama>=0.5.1",
    "pydantic>=2.12.5",
    "psycopg[binary]>=3.3,<4.0",
    "pypdf>=6.1.1",
    "pytest>=9.0.3",
    "python-docx>=1.2.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.26",
    "uvicorn>=0.44.0",
    "onnxruntime>=1.24,<2",
    "onnx>=1.20,<2",
    "tokenizers>=0.22,<1",
    "numpy>=2.3,<3",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-postgres>=3,<4",
    "langchain-postgres>=0.0.16,<0.1",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-p no:cacheprovider"
norecursedirs = ["*pytest-cache-files-*"]
