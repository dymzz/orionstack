[project]
name = "orionstack"
version = "0.1.6"
description = "Minimal FAQ and document QA demo for OrionStack"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.135.3",
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
    "pypdf>=6.1.1",
    "pytest>=9.0.3",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.26",
    "uvicorn>=0.44.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-p no:cacheprovider"
norecursedirs = ["*pytest-cache-files-*"]
